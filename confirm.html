<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jarvis</title>
<style>
  /* Jarvis's look (lit glass, as in the app): a dark sky, one card of glass, the one thing to press lit. */
  @font-face { font-family: "Sora"; src: url("/vendor/fonts/sora-latin.woff2") format("woff2"); font-weight: 200 700; font-display: swap; }
  @font-face { font-family: "Onest"; src: url("/vendor/fonts/onest-latin.woff2") format("woff2"); font-weight: 300 700; font-display: swap; }
  :root { color-scheme: dark; --accent: 79 216 255; --ink: #03121c; --text: #f1f5fc; --muted: #aab6cc; --faint: #808da8; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
    color: var(--text); font: 16px/1.45 "Onest", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    background: radial-gradient(110% 50% at 50% -10%, rgb(var(--accent) / .16), transparent 64%),
      radial-gradient(90% 46% at 100% -6%, rgb(165 139 255 / .12), transparent 66%), linear-gradient(180deg, #050a1d, #02040c 70%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .card {
    position: relative; width: 100%; max-width: 420px; padding: 30px 24px 24px; text-align: center; border-radius: 28px;
    background: linear-gradient(180deg, rgb(255 255 255 / .05), rgb(255 255 255 / .015)), rgb(12 16 30 / .96);
    box-shadow: inset 0 1px 0 rgb(255 255 255 / .14), inset 0 0 0 1px rgb(255 255 255 / .07), 0 40px 90px -30px rgb(0 0 0 / .9);
    animation: arrive .6s cubic-bezier(.16, 1, .3, 1) both;
  }
  @keyframes arrive { from { opacity: 0; transform: translateY(14px) scale(.98); } }
  h1 { font: 400 22px/1.25 "Sora", "Onest", system-ui, sans-serif; letter-spacing: -.02em; margin: 0 0 8px; text-wrap: balance; }
  p { color: var(--muted); font-size: 15px; margin: 0 0 24px; }
  .actions { display: flex; flex-direction: column; gap: 10px; }
  button, .link-btn {
    width: 100%; min-height: 52px; padding: 0 18px; border-radius: 15px; border: none; cursor: pointer; box-sizing: border-box;
    display: flex; align-items: center; justify-content: center; text-decoration: none; font: 600 16px/1 inherit;
    color: var(--ink); background: linear-gradient(180deg, #a6ecff, rgb(var(--accent)) 60%);
    box-shadow: inset 0 1px 0 rgb(255 255 255 / .5), 0 0 0 1px rgb(var(--accent) / .55), 0 12px 28px -12px rgb(var(--accent) / .85);
    transition: transform .12s cubic-bezier(.16, 1, .3, 1), filter .2s;
  }
  button:active, .link-btn:active { transform: scale(.98); filter: brightness(1.08); }
  button.secondary { color: #dbe4f3; background: linear-gradient(180deg, rgb(255 255 255 / .09), rgb(255 255 255 / .04));
    box-shadow: inset 0 0 0 1px rgb(255 255 255 / .1), inset 0 1px 0 rgb(255 255 255 / .07); }
  button:disabled { opacity: .45; cursor: default; transform: none; }
  .status-icon { width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 50%; display: grid; place-items: center; font-size: 28px;
    color: rgb(var(--accent)); background: radial-gradient(circle, rgb(var(--accent) / .16), rgb(var(--accent) / .04) 70%);
    box-shadow: inset 0 0 0 1px rgb(var(--accent) / .3), 0 0 40px -10px rgb(var(--accent) / .6); animation: pop .5s cubic-bezier(.34, 1.4, .64, 1) both; }
  @keyframes pop { from { opacity: 0; transform: scale(.6); } }
  .hint { font-size: 13px; color: var(--faint); margin: 16px 0 0; }
  .hint:empty { display: none; }
  @media (prefers-reduced-motion: reduce) { .card, .status-icon { animation: none; } button, .link-btn { transition: none; } }
</style>
</head>
<body>
  <div class="card" id="card">
    <h1 id="title">Jarvis wants to connect to this computer.</h1>
    <p id="sub">Confirm only if you asked for this just now.</p>
    <div class="actions" id="actions">
      <button id="confirmBtn">Confirmed</button>
      <button class="secondary" id="rejectBtn">Not Confirmed</button>
    </div>
    <p class="hint" id="hint"></p>
  </div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const computerId = params.get("computerId") || "";
  const sessionId = params.get("sessionId") || "";
  const secret = params.get("secret") || "";

  function showResult(decision, ok) {
    const card = $("card");
    if (decision === "confirm" && ok) {
      card.innerHTML = '<div class="status-icon">✓</div>' +
        '<h1>Your phone is connected.</h1>' +
        '<p>Jarvis knows on your computer too. You can close this page, or keep talking to Jarvis here.</p>' +
        '<div class="actions"><a class="link-btn" id="openBtn">Open Jarvis</a></div>';
      $("openBtn").href = `/?session=${encodeURIComponent(sessionId)}&decision=confirm`;
      // Straight into the chat when this phone's pairing is already on this origin (same storage phone_client.html
      // reads) — no second tap. Without it the chat page could only say "not recognized", so stay here instead.
      let paired = false;
      try { paired = !!(localStorage.getItem("jarvis_device") || localStorage.getItem("je" + "rvis_device")); } catch { /* storage blocked: keep the button */ }   // (old name too)
      if (paired) location.replace($("openBtn").href);
    } else if (decision === "reject" && ok) {
      card.innerHTML = '<div class="status-icon">✕</div><h1>Connection cancelled.</h1>' +
        '<p>Nothing was connected. You can close this page.</p>';
    } else {
      card.innerHTML = '<div class="status-icon">⚠</div><h1>That didn\'t work.</h1>' +
        '<p>This request may have expired, or your computer isn\'t reachable right now. Ask Jarvis to ' +
        '"connect my phone" again for a fresh one.</p>';
    }
  }

  async function decide(decision) {
    $("confirmBtn").disabled = true;
    $("rejectBtn").disabled = true;
    $("hint").textContent = "";
    if (!sessionId || !secret) {
      showResult(decision, false);
      return;
    }
    let ok = false;
    try {
      const url = `/decide?computerId=${encodeURIComponent(computerId)}&sessionId=${encodeURIComponent(sessionId)}` +
        `&secret=${encodeURIComponent(secret)}&decision=${decision}`;
      const response = await fetch(url);
      ok = response.ok;
    } catch { /* network error: ok stays false, shown as the same "didn't work" state */ }
    showResult(decision, ok);
  }

  $("confirmBtn").onclick = () => decide("confirm");
  $("rejectBtn").onclick = () => decide("reject");

  // A native notification action button (when the platform supports one) already decided this before the page
  // ever opened — see phone_sw.js — so this just shows the same result screen instead of asking again.
  const prefilled = params.get("decision");
  if (prefilled === "confirm" || prefilled === "reject") {
    $("actions").style.display = "none";
    $("sub").textContent = "";
    decide(prefilled);
  } else if (!sessionId || !secret) {
    $("title").textContent = "This link is missing something.";
    $("sub").textContent = "Ask Jarvis to “connect my phone” again for a fresh link.";
    $("actions").style.display = "none";
  }
})();
</script>
</body>
</html>
